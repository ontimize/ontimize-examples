openapi: 3.0.3
info:
  title: projectwiki API
  version: '1.0'
  description: The projectwiki API
servers:
  - url: '/'
    description: Localhost

paths:
  /users/login:
    $ref: 'api/User.yml#/login'

  /test/test:
    $ref: 'api/Test.yml#/test'

components:
  parameters:
    TenantId:
      in: header
      name: X-Tenant
      required: true
      schema:
        type: string
      x-ignore: true
      examples:
        Tenant1:
          value: 'tenant1'
        Tenant2:
          value: 'tenant2'
  securitySchemes:
    OAuth2Demo1:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://localhost:8082/realms/demo1/protocol/openid-connect/auth
          scopes: {}
    OAuth2Demo2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://localhost:8082/realms/demo2/protocol/openid-connect/auth
          scopes: {}

security:
  - OAuth2Demo1: []
  - OAuth2Demo2: []
